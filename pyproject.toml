[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'where-does-complexity-live'
version = '0.1.0'
description = 'Code for target-conditioned visual complexity readouts'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = ['numpy>=1.26']

[project.optional-dependencies]
complexity = [
  'arviz>=0.23',
  'h5netcdf>=1.8',
  'matplotlib>=3.8',
  'pandas>=2.0',
  'Pillow>=10',
  'pymc>=5.27,<6',
  'pytensor>=2.36',
  'scipy>=1.11',
  'seaborn>=0.13',
  'xarray>=2024.1',
]
engineered = [
  'joblib>=1.3',
  'open-clip-torch>=2.24',
  'pandas>=2.0',
  'Pillow>=10',
  'scikit-learn>=1.3',
  'timm>=1.0',
  'torch>=2.2',
  'torchvision>=0.17',
  'xgboost>=2.0',
]
embedding = [
  'matplotlib>=3.8',
  'open-clip-torch>=2.24',
  'Pillow>=10',
  'scikit-learn>=1.3',
  'scipy>=1.11',
  'torch>=2.2',
  'torchvision>=0.17',
  'tqdm>=4.66',
]
route-b = [
  'huggingface-hub>=1.4',
  'matplotlib>=3.8',
  'open-clip-torch>=2.24',
  'Pillow>=10',
  'scikit-learn>=1.3',
  'scipy>=1.11',
  'timm>=1.0',
  'torch>=2.2',
  'torchvision>=0.17',
  'tqdm>=4.66',
]
scanpaths = [
  'huggingface-hub>=1.4',
  'hydra-core==1.3.2',
  'omegaconf==2.3.1',
  'Pillow>=10',
  'safetensors>=0.7',
  'timm==1.0.9',
  'torch>=2.2',
  'torchvision>=0.17',
]
dev = ['pytest>=8']

[project.scripts]
complexity = 'complexity.__main__:main'
route-a-engineered = 'route_a.engineered.__main__:main'
route-a-embedding = 'route_a.embedding.__main__:main'
route-b = 'route_b.__main__:main'

[tool.setuptools.packages.find]
include = ['complexity*', 'route_a*', 'route_b*', 'shared*']
exclude = ['complexity.tests*', 'route_a.engineered.tests*', 'route_a.embedding.tests*', 'route_b.tests*']
namespaces = true

[tool.setuptools.package-data]
complexity = ['README.md', '*.csv', 'config.example.json', 'requirements.lock.txt']
'complexity.generation' = ['requirements.lock.txt']
route_a = ['README.md']
'route_a.engineered' = ['README.md', 'requirements.lock.txt']
'route_a.embedding' = ['README.md', 'requirements.lock.txt']
route_b = ['README.md', 'requirements.lock.txt', 'paper_*.csv']
'route_b.experiments' = ['paper.example.json']
shared = ['README.md']
