[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'where-does-complexity-live'
version = '0.1.0'
description = 'Code for target-conditioned visual complexity readouts'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
  'joblib>=1.3',
  'numpy>=1.26',
  'pandas>=2.0',
  'Pillow>=10',
  'scikit-learn>=1.3',
  'xgboost>=2.0',
]

[project.optional-dependencies]
engineered = [
  'torch>=2.2',
  'torchvision>=0.17',
  'timm>=1.0',
  'open-clip-torch>=2.24',
]
dev = ['pytest>=8']

[project.scripts]
complexity-route-a = 'route_a.engineered.__main__:main'

[tool.setuptools.packages.find]
include = ['route_a*']
