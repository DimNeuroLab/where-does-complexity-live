[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'where-does-complexity-live'
version = '0.1.0'
description = 'Code for target-conditioned visual complexity readouts'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
  'numpy>=1.26',
  'scipy>=1.11',
  'scikit-learn>=1.3',
]

[project.optional-dependencies]
embedding = [
  'torch>=2.2',
  'torchvision>=0.17',
  'open-clip-torch>=2.24',
  'matplotlib>=3.8',
  'Pillow>=10',
  'tqdm>=4.66',
]

[project.scripts]
complexity-route-a-embedding = 'route_a.embedding.__main__:main'

[tool.setuptools.packages.find]
include = ['route_a*', 'shared*']
