[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'where-does-complexity-live'
version = '0.1.0'
description = 'Code for target-conditioned visual complexity readouts'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
  'joblib>=1.3',
  'numpy>=1.26',
  'pandas>=2.0',
  'Pillow>=10',
  'scikit-learn>=1.3',
  'scipy>=1.11',
  'xgboost>=2.0',
]

[project.optional-dependencies]
engineered = [
  'torch>=2.2',
  'torchvision>=0.17',
  'timm>=1.0',
  'open-clip-torch>=2.24',
]
embedding = [
  'torch>=2.2',
  'torchvision>=0.17',
  'open-clip-torch>=2.24',
  'matplotlib>=3.8',
  'Pillow>=10',
  'tqdm>=4.66',
]
dev = ['pytest>=8']

[project.scripts]
complexity-route-a = 'route_a.engineered.__main__:main'
complexity-route-a-embedding = 'route_a.embedding.__main__:main'

[tool.setuptools.packages.find]
include = ['complexity*', 'route_a*', 'route_b*', 'shared*']
exclude = ['complexity.tests*', 'complexity.reference*', 'route_b.tests*', 'route_b.reference*']
namespaces = true

[tool.setuptools.package-data]
complexity = ['nsd_m2_ranking.csv', 'config.example.json', 'source_manifest.json', 'reference/*.csv']
'complexity.generation' = ['source_manifest.json', 'requirements*.txt']
route_b = ['requirements.lock.txt', 'reference/*.csv', 'reference/*.json']
'route_b.experiments' = ['*.json', '*.example']
'route_b.development' = ['*.json']
